name: Import production foundation
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-foundation.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Copy the pinned source project, including licensed media and voice references
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/foundation.tar.gz"
          source_dir="$RUNNER_TEMP/recap-foundation"
          mkdir -p "$source_dir"
          curl -fLsS --retry 3 https://codeload.github.com/justsomeoneretarded/Top10-Movies/tar.gz/c6f82a621b9de57a2c180a74cd9e37e17f2a6a92 -o "$archive"
          tar -xzf "$archive" --strip-components=1 -C "$source_dir"
          rsync -a --exclude='.git' --exclude='.github/workflows/' "$source_dir/" ./
          git switch -c import/foundation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import pinned video production foundation and licensed assets'
          git push origin HEAD:refs/heads/import/foundation
